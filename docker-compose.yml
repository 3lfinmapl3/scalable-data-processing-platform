services:

  postgres:
    image: postgres:17
    container_name: scalable-platform-postgres

    environment:
      POSTGRES_DB: scalable_platform
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: